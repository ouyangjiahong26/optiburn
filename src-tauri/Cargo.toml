[workspace]
# 独立工具链：src-tauri 是自己的 workspace 根，不并入仓库根 workspace（ADR-0008）。
# 没有这一段，cargo 会向上找到根 Cargo.toml 并因本包不在 members 里而报错。

[package]
name = "optiburn-gui"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "OptiBurn 图形前端"

[[bin]]
name = "optiburn-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 生产二进制必须让 tauri 打开 custom-protocol（tauri CLI 构建时自动加）。裸
# `cargo build --release` 不带它时 tauri::is_dev() 为真，窗口会去连 build.devUrl，
# 界面上只会看到连接被拒。
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 应用内更新（ADR-0015）：updater 负责检查、下载与就地替换，process 只用它的 relaunch。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 界面语言跟随系统：启动时读一次系统 locale，决定后端文案用中文还是英文。
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
optiburn-engine = { path = "../crates/optiburn-engine" }
optiburn-mastering = { path = "../crates/optiburn-mastering" }
optiburn-mmc = { path = "../crates/optiburn-mmc" }
optiburn-transport = { path = "../crates/optiburn-transport" }

[target.'cfg(target_os = "linux")'.dependencies]
# 复制盘上文件到系统剪贴板要用 GTK3 的剪贴板（提供 GNOME 的复制文件目标）。
# 版本与 tauri 依赖的 gtk 对齐（0.18）。
gtk = "0.18"
