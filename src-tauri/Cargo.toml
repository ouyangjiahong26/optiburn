[workspace]
# 独立工具链：src-tauri 是自己的 workspace 根，不并入仓库根 workspace（ADR-0008）。
# 没有这一段，cargo 会向上找到根 Cargo.toml 并因本包不在 members 里而报错。

[package]
name = "optiburn-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OptiBurn 图形前端"

[[bin]]
name = "optiburn-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
optiburn-engine = { path = "../crates/optiburn-engine" }
optiburn-mastering = { path = "../crates/optiburn-mastering" }
optiburn-mmc = { path = "../crates/optiburn-mmc" }
optiburn-transport = { path = "../crates/optiburn-transport" }
