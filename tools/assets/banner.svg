<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 400" width="1536" height="400">
  <!--
    optiburn README 横幅。画布 1536×400（约 3.8:1）：README 里按 896 宽渲染时高约 233px，
    不占满整屏。只有左侧的应用标记与字标，元素刻意放大，不放说明性小字。
    底色与界面暗色主题同一族。字标用具体字体名而非通用族，避免渲染器回退到衬线体。
  -->
  <defs>
    <radialGradient id="glow" cx="20%" cy="24%" r="70%">
      <stop offset="0" stop-color="#7b82f4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7b82f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="discg" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="0.55" stop-color="#d9d9d9"/>
      <stop offset="1" stop-color="#a6a6a6"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="400" fill="#141414"/>
  <rect width="1536" height="400" fill="url(#glow)"/>

  <!-- 应用标记（银色光盘，与 src-tauri/icons 同源），32 单位网格放大 4.5 倍 -->
  <g transform="translate(104 128) scale(4.5)">
    <circle cx="16" cy="16" r="15" fill="url(#discg)" stroke="#8f8f8f" stroke-width="0.5"/>
    <circle cx="16" cy="16" r="4.8" fill="#151515"/>
    <circle cx="16" cy="16" r="2.1" fill="#e8e8e8"/>
  </g>

  <!-- 字标：唯一的文字元素 -->
  <text x="300" y="232" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="84" font-weight="600" fill="#E8E8EA" letter-spacing="-2">OptiBurn</text>
</svg>
