version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # hadris 家族各 crate 必须同版本：工作区直接声明 2 个（hadris-cd、hadris-udf），
      # Cargo.lock 里解析出 9 个，都由 hadris-cd 2.5.0 的内部依赖决定。不分组会开出
      # 互相冲突且都编不过的多个 PR。
      hadris:
        patterns:
          - "hadris-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
