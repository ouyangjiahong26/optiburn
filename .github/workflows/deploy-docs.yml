name: Deploy Docs to GitHub Pages

# Pages：仓库 Settings 的 Pages 页把 Source 选为“GitHub Actions”。站点 URL 与 docs-site/docusaurus.config.ts 中 baseUrl 一致。
# 触发方式：等 main 上的 CI 成功后再部署，避免 CI 红着却把“已修好”的文档发出去。
# 也可在 Actions 中手动 Run workflow（workflow_dispatch）。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # workflow_run 会在 CI 失败/取消时也触发，这里只放行成功的那次。手动触发无 workflow_run 上下文，照常执行。
    # 只认本仓库自己的 CI（push 触发）：workflow_run 的 branches 过滤匹配的是触发运行的
    # head 分支，fork 里叫 main 的分支也能命中，若不校验来源，fork 代码会被构建并发布到
    # 正式站点。head_repository 与 event 两道判断把来源锁在本仓库的 push 上。
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run 下锁定到触发 CI 的那个 commit。手动触发时该值为空，退回默认分支。
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: docs-site
      - name: Build website
        run: npm run build
        working-directory: docs-site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
