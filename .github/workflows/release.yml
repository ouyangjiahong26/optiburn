name: Release

on:
  push:
    tags: ["v*"]

# 只有最后一个 job 需要写权限（建 Release），其余 job 只读。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: 构建 Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release -p optiburn-cli --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          tar -czf optiburn-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release optiburn
          sha256sum optiburn-x86_64-unknown-linux-gnu.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: optiburn-x86_64-unknown-linux-gnu
          path: optiburn-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  build-windows:
    name: 构建 Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p optiburn-cli --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/optiburn.exe" -DestinationPath "optiburn-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: optiburn-${{ matrix.target }}
          path: optiburn-${{ matrix.target }}.zip
          if-no-files-found: error

  build-gui-windows:
    name: 构建 Windows GUI 安装包 (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      # NSIS 打包走 tauri CLI：先编前端，再编译 src-tauri 并出安装包。
      - name: 构建 NSIS 安装包
        run: npm --prefix frontend exec -- tauri build --target ${{ matrix.target }} --bundles nsis
      # 便携版 zip（改名后的单个主程序）供 Scoop 这类直接解压的渠道使用。
      - name: 打包便携版
        shell: pwsh
        run: |
          $dir = "src-tauri/target/${{ matrix.target }}/release"
          Copy-Item "$dir/optiburn-gui.exe" "$dir/optiburn.exe"
          Compress-Archive -Path "$dir/optiburn.exe" -DestinationPath "optiburn-gui-${{ matrix.target }}-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: optiburn-gui-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            optiburn-gui-${{ matrix.target }}-portable.zip
          if-no-files-found: error

  build-gui-linux:
    name: 构建 Linux GUI 安装包 (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Tauri 的 Linux 构建前置（webkit2gtk 供 wry/tauri 编译期 pkg-config 探测），与 CI 的 gui job 同一套。
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      # AppImage 与 deb 打包走 tauri CLI：先编前端（beforeBuildCommand），再编译 src-tauri 并出两种包。
      - name: 构建 AppImage 与 deb
        run: npm --prefix frontend exec -- tauri build --target ${{ matrix.target }} --bundles appimage,deb
      # 两个 glob 分属 appimage/ 与 deb/，upload-artifact 按最小公共祖先保留相对路径，
      # 会带出子目录；release job 的 dist/* 与 sha256sum 只吃顶层文件，先拍平再传。
      - name: Stage bundles
        run: |
          mkdir -p bundles
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage bundles/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb bundles/
      - uses: actions/upload-artifact@v7
        with:
          name: optiburn-gui-linux-${{ matrix.arch }}
          path: bundles/*
          if-no-files-found: error

  release:
    name: 发布
    needs: [build-linux, build-windows, build-gui-windows, build-gui-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # 发布说明直接取 CHANGELOG 里对应的小节，避免 Release 页与仓库文档两处维护。
      - name: 生成发布说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 里没有 $version 的小节" >&2
            exit 1
          fi
          cat release-notes.md
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
